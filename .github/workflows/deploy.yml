name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd /home/ubuntu/btcmap-admin
          git pull origin main
          /home/ubuntu/.local/bin/uv sync
          sudo systemctl restart btcmap-admin
